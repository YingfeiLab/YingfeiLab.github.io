favicon: /img/avatar.svg
apple_touch_icon: /img/avatar.svg
force_https: true

dark_mode:
  enable: true
  default: auto

color:
  body_bg_color: "#f4f7fb"
  body_bg_color_dark: "#101720"
  navbar_bg_color: "#0b1f33"
  navbar_bg_color_dark: "#09131f"
  link_hover_color: "#16a6a1"
  link_hover_color_dark: "#5ed8d2"
  post_link_color: "#087f8c"
  post_link_color_dark: "#5ed8d2"

font:
  font_size: 16px
  font_family: 'Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif'
  letter_spacing: 0.015em

custom_css:
  - /css/custom.css
  - /css/tailscale-guide.css

custom_js:
  - /js/tailscale-guide.js

navbar:
  blog_title: "Yingfei Lab"
  ground_glass:
    enable: true
    px: 8
    alpha: 0.72
  menu:
    - { key: "首页", link: "/", icon: "iconfont icon-home-fill" }
    - { key: "网络互联", link: "/categories/network-connectivity/", icon: "iconfont icon-link-fill" }
    - { key: "归档", link: "/archives/", icon: "iconfont icon-archive-fill" }
    - { key: "项目", link: "/projects/", icon: "iconfont icon-code" }
    - { key: "论文", link: "/publications/", icon: "iconfont icon-book-fill" }
    - { key: "关于", link: "/about/", icon: "iconfont icon-user-fill" }

search:
  enable: true
  path: /local-search.xml
  generate_path: local-search.xml
  field: all
  content: true

banner:
  parallax: true
  width_height_ratio: 0.7

index:
  banner_img: /img/research-network.svg
  banner_img_height: 92
  banner_mask_alpha: 0.28
  slogan:
    enable: true
    text:
      - "Deterministic Networks × Intelligent Edge Systems"
      - "让通信、计算与智能在边缘协同演进"
  auto_excerpt:
    enable: true

post:
  banner_img: /img/research-network.svg
  banner_img_height: 55
  banner_mask_alpha: 0.42
  default_index_img: /img/research-network.svg
  meta:
    author:
      enable: true
    date:
      enable: true
      format: "YYYY-MM-DD"
    wordcount:
      enable: true
    min2read:
      enable: true
      awl: 2
      wpm: 300
  updated:
    enable: true
    date_format: "YYYY-MM-DD"
    relative: false
  copyright:
    enable: true
    license: BY-NC-SA
    author:
      enable: true

archive:
  banner_img: /img/research-network.svg
  banner_img_height: 45
  banner_mask_alpha: 0.42

category:
  enable: true
  banner_img: /img/research-network.svg
  banner_img_height: 45
  banner_mask_alpha: 0.42

tag:
  enable: true
  banner_img: /img/research-network.svg
  banner_img_height: 45
  banner_mask_alpha: 0.42

about:
  enable: true
  banner_img: /img/research-network.svg
  banner_img_height: 48
  banner_mask_alpha: 0.42
  avatar: /img/avatar.svg
  name: "Yingfei Yao"
  intro: "Industrial Edge Intelligence · TSN · Edge LLM/LMM Systems"
  icons:
    - { class: "iconfont icon-github-fill", link: "https://github.com/YingfeiLab", tip: "GitHub" }
    - { class: "iconfont icon-mail", link: "mailto:yaoyfbox@163.com", tip: "Email" }

page:
  banner_img: /img/research-network.svg
  banner_img_height: 48
  banner_mask_alpha: 0.42

page404:
  enable: true
  banner_img: /img/research-network.svg
  banner_img_height: 85
  banner_mask_alpha: 0.38
  redirect_delay: 5000

footer:
  content: 'Built with <a href="https://hexo.io" target="_blank" rel="nofollow noopener">Hexo</a> · Theme <a href="https://github.com/fluid-dev/hexo-theme-fluid" target="_blank" rel="nofollow noopener">Fluid</a>'
  statistics:
    enable: false

fun_features:
  typing:
    enable: true
    typeSpeed: 48
    cursorChar: "_"
    loop: false
    scope: [home]
  progressbar:
    enable: true
    height_px: 3
    color: "#23b5af"
    options: { showSpinner: false, trickleSpeed: 100 }

favicon: /img/avatar.svg
apple_touch_icon: /img/avatar.svg
force_https: true

dark_mode:
  enable: true
  default: auto

# Inherit Fluid's default palette and typography. Keep only site-specific settings.

custom_css:
  - /css/custom.css
  - /css/tailscale-guide.css

custom_js:
  - /js/tailscale-guide.js

navbar:
  blog_title: "Yingfei Lab"
  ground_glass:
    enable: false
  menu:
    - { key: "首页", link: "/", icon: "iconfont icon-home-fill" }
    - { key: "归档", link: "/archives/", icon: "iconfont icon-archive-fill" }
    - { key: "分类", link: "/categories/", icon: "iconfont icon-category-fill" }
    - { key: "标签", link: "/tags/", icon: "iconfont icon-tags-fill" }
    - { key: "项目", link: "/projects/", icon: "iconfont icon-code" }
    - { key: "论文", link: "/publications/", icon: "iconfont icon-book-fill" }
    - { key: "关于", link: "/about/", icon: "iconfont icon-user-fill" }

search:
  enable: true
  path: /local-search.xml
  generate_path: local-search.xml
  field: all
  content: true

banner:
  parallax: true
  width_height_ratio: 1.0

index:
  # Official demo backgrounds: https://github.com/fluid-dev/hexo-fluid-blog
  banner_img: "https://fluid.s3.bitiful.net/bg/vdysjx.png?w=1920&fmt=webp"
  banner_img_height: 100
  banner_mask_alpha: 0.3
  slogan:
    enable: true
    # Empty text uses the site's subtitle from _config.yml.
    text: ""
  auto_excerpt:
    enable: true

post:
  banner_img: "https://fluid.s3.bitiful.net/bg/dojm2h.png?w=1920&q=100&fmt=webp"
  banner_img_height: 70
  banner_mask_alpha: 0.3
  meta:
    author:
      enable: true
    date:
      enable: true
      format: "YYYY-MM-DD"
    wordcount:
      enable: true
    min2read:
      enable: true
      awl: 2
      wpm: 300
  updated:
    enable: true
    date_format: "YYYY-MM-DD"
    relative: false
  copyright:
    enable: true
    license: BY-NC-SA
    author:
      enable: true

archive:
  banner_img: "https://fluid.s3.bitiful.net/bg/1cm6iu.png?w=1920&fmt=webp"
  banner_img_height: 60
  banner_mask_alpha: 0.3

category:
  enable: true
  order_by: "-length"
  collapse_depth: 0
  post_order_by: "-date"
  banner_img: "https://fluid.s3.bitiful.net/bg/sdqryn.png?w=1920&fmt=webp"
  banner_img_height: 60
  banner_mask_alpha: 0.3

tag:
  enable: true
  banner_img: "https://fluid.s3.bitiful.net/bg/n7a9bv.png?w=1920&fmt=webp"
  banner_img_height: 80
  banner_mask_alpha: 0.3

about:
  enable: true
  banner_img: "https://fluid.s3.bitiful.net/bg/4xvpqo.png?w=1920&fmt=webp"
  banner_img_height: 60
  banner_mask_alpha: 0.3
  avatar: /img/avatar.svg
  name: "Yingfei Yao"
  intro: "Industrial Edge Intelligence · TSN · Edge LLM/LMM Systems"
  icons:
    - { class: "iconfont icon-github-fill", link: "https://github.com/YingfeiLab", tip: "GitHub" }
    - { class: "iconfont icon-mail", link: "mailto:yaoyfbox@163.com", tip: "Email" }

page:
  banner_img: "https://fluid.s3.bitiful.net/bg/post.png?w=1920&fmt=webp"
  banner_img_height: 60
  banner_mask_alpha: 0.3

page404:
  enable: true
  banner_img: "https://fluid.s3.bitiful.net/bg/g8xjqe.png?w=1920&fmt=webp"
  banner_img_height: 85
  banner_mask_alpha: 0.3
  redirect_delay: 5000

links:
  banner_img: "https://fluid.s3.bitiful.net/bg/73twhs.png?w=1920&fmt=webp"

footer:
  statistics:
    enable: false

fun_features:
  typing:
    enable: true
    typeSpeed: 70
    cursorChar: "_"
    loop: false
    scope: []
  progressbar:
    enable: true
    height_px: 3
    color: "#29d"
    options: { showSpinner: false, trickleSpeed: 100 }

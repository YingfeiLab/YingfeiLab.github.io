# Site
title: Yingfei Lab
subtitle: 确定性网络与智能边缘系统
description: Yingfei Yao 的研究与技术博客，记录时间敏感网络、工业边缘计算、分布式强化学习与边缘大模型系统。
keywords:
  - Time-Sensitive Networking
  - Industrial Edge Computing
  - Edge AI
  - Distributed LLM Inference
  - Reinforcement Learning
author: Yingfei Yao
language: zh-CN
timezone: Asia/Shanghai

# URL
url: https://yingfeilab.github.io
root: /
permalink: posts/:title/
permalink_defaults:
pretty_urls:
  trailing_index: false
  trailing_html: false

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude:
filename_case: 1
render_drafts: false
post_asset_folder: true
relative_link: false
# Keep publication dates based on the authoring timezone instead of the CI runner clock.
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: true
  tab_replace: "  "
  wrap: true
  hljs: false

# Home
index_generator:
  path: ""
  per_page: 8
  order_by: -date

# Category & Tag
default_category: 随笔
category_map:
  网络互联教程: network-connectivity
tag_map:

# Date-based archives are independent of homepage sticky posts.
archive_generator:
  yearly: true
  monthly: true
  daily: false
  order_by: -date

# Topic-based lists show the most recent posts first within each topic.
category_generator:
  order_by: -date

tag_generator:
  order_by: -date

# Metadata and dates
meta_generator: true
date_format: YYYY-MM-DD
time_format: HH:mm
updated_option: date

# Pagination
per_page: 10
pagination_dir: page

# Theme and local search
theme: fluid
search:
  path: local-search.xml
  field: all
  content: true
  format: html

# GitHub Actions handles deployment
deploy:
  type: ""
